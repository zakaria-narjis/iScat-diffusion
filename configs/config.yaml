seed: 0
experiment_name: "iscat_ddpm"
data:
  image_size: 256
  z_chunk_size: 32
  mask_channels: 3  # Number of mask channels (particle sizes+background)
  fluo_masks_indices: [0, 1] # 0: 80nm, 1: 300nm, 2: 600nm
  seg_method: "comdet"
  one_hot_encode: True
  data_type: "Brightfield"
  normalize: "zscore" # "minmax" or "zscore" or "global_zscore"
  multi_class: true # If True the masks will have multiple classes (one per particle size+ class 0: background). If False, all particles are merged into one class.
  dataset_folder_path: "/scratch/narjis/iscat_data/brightfield.hdf5"
  indices: null
  train_dataset:
    num_workers: 8
    apply_augmentation: true
    normalize: ${data.normalize}
    classes: ${data.fluo_masks_indices}
    multi_class: ${data.multi_class}

  valid_dataset:
    num_workers: 4
    apply_augmentation: false
    normalize: ${data.normalize}
    classes: ${data.fluo_masks_indices}
    multi_class: ${data.multi_class}

training:
  batch_size: 64
  num_epochs: 400
  train_split_size: 0.9

  optimizer:
    type: "AdamW"
    parameters:
      lr: 1e-3
      weight_decay: 1e-6
      betas: [0.9, 0.999]

  scheduler:
    type: "CosineAnnealingLR"   # or "CosineAnnealingLR" # ReduceLROnPlateau
    parameters:
      # ReduceLROnPlateau
      mode: "min"
      factor: 0.1
      patience: 8

      # CosineAnnealingLR
      T_max: 400
      eta_min: 1e-6
  loss:
    class_weights : [1.0,10.0, 15.0]  # Weights for each class in multi-class setting
  early_stopping:
    enabled: true
    patience: 30
    criterion: "min"   # "min" or "max"

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"   # "linear" or "cosine"

model:
  type: "U_Net"
  contrast_conditioning:
    enabled: true
  unet:
    init_features: 64

output:
  output_dir: "./experiments"

# Test configuration
test:
  num_examples: 8  # Number of visualization examples to save
  sampling_method: "ddim"  # "ddpm" or "ddim"
  sampling_steps: 250  # Number of denoising steps at test time (much faster than training timesteps)
  ddim_eta: 0.0  # 0.0 = deterministic, 1.0 = stochastic (DDPM-like)