seed: 0
experiment_name: "iscat_ddpm"
data:
  image_size: 256 # Fixed parameter
  z_chunk_size: 32 # min 1 max 201
  mask_channels: 3  # Number of mask channels (particle sizes+background) number_particle+1 (+1 for background)
  fluo_masks_indices: [0, 1] # 0: 80nm, 1: 300nm, 2: 600nm
  seg_method: "comdet" # Legacy parameter
  one_hot_encode: True # Fixed
  data_type: "Brightfield" # Choose Brightfield, Laser NOT IMPLEMENTED
  normalize: "zscore" # "minmax" or "zscore" or "global_zscore"
  multi_class: true # If True the masks will have multiple classes (one per particle size+ class 0: background). If False, all particles are merged into one class.
  dataset_folder_path: "/data_ssd2/iscat_data/brightfield.hdf5" # dataset path "/scratch/narjis/iscat_data/brightfield.hdf5"
  indices: null # list of indicies to use for eg [0,1,...50]. If we want a subdata. null= use all images
  train_dataset:
    num_workers: 8 #number of w
    apply_augmentation: true
    normalize: ${data.normalize}
    classes: ${data.fluo_masks_indices}
    multi_class: ${data.multi_class}

  valid_dataset:
    num_workers: 4
    apply_augmentation: false
    normalize: ${data.normalize}
    classes: ${data.fluo_masks_indices}
    multi_class: ${data.multi_class}

training:
  batch_size: 24
  num_epochs: 400
  train_split_size: 0.9

  optimizer:
    type: "AdamW" # this option not implemented
    parameters:
      lr: 1e-4
      weight_decay: 1e-6
      betas: [0.9, 0.999]

  scheduler:
    type: "CosineAnnealingLR"   # or "CosineAnnealingLR" # ReduceLROnPlateau
    parameters:
      # ReduceLROnPlateau
      mode: "min"
      factor: 0.1
      patience: 8

      # CosineAnnealingLR
      T_max: 400
      eta_min: 1e-6
  loss:
    class_weights : [1.0,10.0, 15.0]  # Weights for each class in multi-class setting
  early_stopping:
    enabled: true
    patience: 30
    criterion: "min"   # "min" or "max"

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"   # "linear" or "cosine"
  cosine_smooth: 0.008  # Smoothing factor for cosine beta schedule
model:
  type: "U_Net"
  contrast_conditioning:
    enabled: true
  unet:
    init_features: 64

output:
  output_dir: "./experiments"

# Test configuration
test:
  num_examples: 8  # Number of visualization examples to save
  sampling_method: "ddim"  # "ddpm" or "ddim"
  sampling_steps: 250  # Number of denoising steps at test time (much faster than training timesteps)
  ddim_eta: 0.0  # 0.0 = deterministic, 1.0 = stochastic (DDPM-like)